name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: find web -name '*.js' -print0 | xargs -0 -I{} sh -c 'node --input-type=module --check < "$1"' _ {}
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Frontend tests
        run: for file in tests/*.test.cjs; do node "$file" || exit 1; done
      - name: Related-tag index tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Database and route checks
        run: python tests/backend_smoke.py
